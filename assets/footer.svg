<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Gracias por visitar">
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.5" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="t" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.5" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#FB923C"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1200 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace; }
  </style>
  <path fill="url(#w)" opacity="0.25">
    <animate attributeName="d" dur="9s" repeatCount="indefinite"
      values="M0 120 C200 80 400 160 600 120 C800 80 1000 160 1200 120 V200 H0Z;
              M0 120 C200 160 400 80 600 120 C800 160 1000 80 1200 120 V200 H0Z;
              M0 120 C200 80 400 160 600 120 C800 80 1000 160 1200 120 V200 H0Z"/>
  </path>
  <path fill="url(#w)" opacity="0.45">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M0 150 C300 120 500 180 800 150 C1000 130 1100 170 1200 150 V200 H0Z;
              M0 150 C300 180 500 120 800 150 C1000 170 1100 130 1200 150 V200 H0Z;
              M0 150 C300 120 500 180 800 150 C1000 130 1100 170 1200 150 V200 H0Z"/>
  </path>
  <path fill="url(#w)" opacity="0.8">
    <animate attributeName="d" dur="5s" repeatCount="indefinite"
      values="M0 175 C250 160 450 190 700 175 C950 160 1050 190 1200 175 V200 H0Z;
              M0 175 C250 190 450 160 700 175 C950 190 1050 160 1200 175 V200 H0Z;
              M0 175 C250 160 450 190 700 175 C950 160 1050 190 1200 175 V200 H0Z"/>
  </path>
  <text x="600" y="62" text-anchor="middle" class="sans" font-size="34" font-weight="800" fill="url(#t)">Gracias por pasar ✨</text>
  <text x="600" y="96" text-anchor="middle" class="mono" font-size="16" fill="#C4B5FD">mientras tanto, sigo construyendo 🚀</text>
</svg>
