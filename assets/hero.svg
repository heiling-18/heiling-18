<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Heiling León — Desarrolladora Full-Stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0716"/>
      <stop offset="1" stop-color="#120A1F"/>
    </linearGradient>

    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#EC4899" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F97316" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="700" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.5" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#FB923C"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1400 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.5" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <clipPath id="typeClip">
      <rect x="60" y="226" width="0" height="40">
        <animate attributeName="width" values="0;640;640;0" keyTimes="0;0.45;0.85;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .float { animation: float 6s ease-in-out infinite; }
    .float2 { animation: float 7s ease-in-out infinite reverse; }
    .blink { animation: blink 1s steps(1) infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .chip { animation: rise 0.9s ease-out both; }
    .c1 { animation-delay: .2s } .c2 { animation-delay: .4s } .c3 { animation-delay: .6s } .c4 { animation-delay: .8s }
    @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
    @keyframes blink { 0%,50% { opacity: 1 } 51%,100% { opacity: 0 } }
    @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
    @keyframes rise { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: translateY(0) } }
  </style>

  <!-- fondo -->
  <rect width="1200" height="380" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="22" fill="url(#grid)"/>

  <!-- luces que se mueven -->
  <circle cx="220" cy="80" r="260" fill="url(#glowA)">
    <animate attributeName="cx" values="220;320;220" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="300" r="280" fill="url(#glowB)">
    <animate attributeName="cy" values="300;220;300" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="40" r="200" fill="url(#glowC)">
    <animate attributeName="cx" values="760;640;760" dur="14s" repeatCount="indefinite"/>
  </circle>

  <!-- estrellitas -->
  <g fill="#FFFFFF">
    <circle cx="540" cy="60" r="1.6" class="pulse"/>
    <circle cx="610" cy="320" r="1.4" class="pulse" style="animation-delay:.8s"/>
    <circle cx="1140" cy="40" r="1.8" class="pulse" style="animation-delay:1.4s"/>
    <circle cx="470" cy="350" r="1.2" class="pulse" style="animation-delay:.4s"/>
    <circle cx="700" cy="180" r="1.3" class="pulse" style="animation-delay:1.9s"/>
  </g>

  <!-- prompt -->
  <text x="60" y="78" class="mono" font-size="18" fill="#A78BFA">~/heiling-18 <tspan fill="#F472B6">$</tspan> <tspan fill="#E9E5F5">whoami</tspan></text>

  <!-- nombre con brillo -->
  <text x="56" y="172" class="sans" font-size="86" font-weight="800" letter-spacing="-2" fill="url(#neon)" filter="url(#soft)" opacity="0.45">Heiling León</text>
  <text x="56" y="172" class="sans" font-size="86" font-weight="800" letter-spacing="-2" fill="url(#neon)">Heiling León</text>

  <!-- subtítulo con efecto de escritura -->
  <g clip-path="url(#typeClip)">
    <text x="60" y="256" class="mono" font-size="24" fill="#E9E5F5">Desarrolladora Full-Stack · Java · Next.js</text>
  </g>
  <rect x="60" y="234" width="12" height="28" fill="#F472B6" class="blink">
    <animate attributeName="x" values="60;700;700;60" keyTimes="0;0.45;0.85;1" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- chips -->
  <g class="mono" font-size="15">
    <g class="chip c1">
      <rect x="60" y="296" width="150" height="38" rx="19" fill="#1A1030" stroke="#A78BFA" stroke-opacity="0.6"/>
      <text x="135" y="320" text-anchor="middle" fill="#C4B5FD">☕ Spring Boot</text>
    </g>
    <g class="chip c2">
      <rect x="222" y="296" width="132" height="38" rx="19" fill="#1A1030" stroke="#F472B6" stroke-opacity="0.6"/>
      <text x="288" y="320" text-anchor="middle" fill="#F9A8D4">⚡ Next.js</text>
    </g>
    <g class="chip c3">
      <rect x="366" y="296" width="150" height="38" rx="19" fill="#1A1030" stroke="#FB923C" stroke-opacity="0.6"/>
      <text x="441" y="320" text-anchor="middle" fill="#FDBA74">🐘 PostgreSQL</text>
    </g>
    <g class="chip c4">
      <rect x="528" y="296" width="112" height="38" rx="19" fill="#1A1030" stroke="#A78BFA" stroke-opacity="0.6"/>
      <text x="584" y="320" text-anchor="middle" fill="#C4B5FD">🤖 n8n</text>
    </g>
  </g>

  <!-- tarjeta de código flotante -->
  <g class="float">
    <rect x="760" y="60" width="380" height="236" rx="16" fill="#0F0A1C" fill-opacity="0.92" stroke="url(#border)" stroke-width="1.5"/>
    <circle cx="786" cy="84" r="6" fill="#FF5F57"/>
    <circle cx="806" cy="84" r="6" fill="#FEBC2E"/>
    <circle cx="826" cy="84" r="6" fill="#28C840"/>
    <text x="1120" y="89" text-anchor="end" class="mono" font-size="12" fill="#7C6B9C">Heiling.java</text>
    <g class="mono" font-size="15">
      <text x="784" y="126"><tspan fill="#F472B6">public class</tspan> <tspan fill="#FDBA74">Heiling</tspan> <tspan fill="#E9E5F5">{</tspan></text>
      <text x="804" y="154"><tspan fill="#A78BFA">String</tspan> <tspan fill="#E9E5F5">rol =</tspan> <tspan fill="#86EFAC">"Full-Stack"</tspan><tspan fill="#E9E5F5">;</tspan></text>
      <text x="804" y="182"><tspan fill="#A78BFA">String</tspan> <tspan fill="#E9E5F5">foco =</tspan> <tspan fill="#86EFAC">"Backend"</tspan><tspan fill="#E9E5F5">;</tspan></text>
      <text x="804" y="210"><tspan fill="#A78BFA">boolean</tspan> <tspan fill="#E9E5F5">aprendiendo =</tspan> <tspan fill="#FB923C">true</tspan><tspan fill="#E9E5F5">;</tspan></text>
      <text x="804" y="238"><tspan fill="#A78BFA">void</tspan> <tspan fill="#FDBA74">construir</tspan><tspan fill="#E9E5F5">() { </tspan><tspan fill="#7C6B9C">/* 🚀 */</tspan><tspan fill="#E9E5F5"> }</tspan></text>
      <text x="784" y="268" fill="#E9E5F5">}</text>
    </g>
  </g>

  <!-- insignia flotante -->
  <g class="float2">
    <rect x="990" y="318" width="170" height="36" rx="18" fill="#1A1030" stroke="#F472B6" stroke-opacity="0.7"/>
    <circle cx="1012" cy="336" r="5" fill="#28C840" class="pulse"/>
    <text x="1084" y="341" text-anchor="middle" class="mono" font-size="13" fill="#F9A8D4">código + café ☕</text>
  </g>
</svg>
