  <clipPath id="card"><rect x="10" y="10" width="540" height="340" rx="22"/></clipPath>
</defs>
<rect x="10" y="10" width="540" height="340" rx="22" fill="#140C24" stroke="url(#edge)" stroke-width="2"/>
<g clip-path="url(#card)">
