<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" role="img" aria-label="Carnet de desarrolladora">
<defs>
  
  <linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="400" y2="0" spreadMethod="reflect">
    <stop offset="0" stop-color="#A78BFA"/><stop offset="0.5" stop-color="#F472B6"/><stop offset="1" stop-color="#FB923C"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="800 0" dur="5s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="holo" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
